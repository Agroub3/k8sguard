name: K8sGuard CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan-apps:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: juice-shop-vulnerable
            image: bkimminich/juice-shop:latest
            manifest: infra/manifests/juice-shop-insecure.yaml
            ignore_unfixed: false
            severity: CRITICAL,HIGH
          - name: podinfo-secure
            image: ghcr.io/stefanprodan/podinfo:6.15.0
            manifest: infra/manifests/podinfo-secure.yaml
            ignore_unfixed: true
            severity: CRITICAL
    steps:
      - uses: actions/checkout@v4

      - name: Trivy image scan — ${{ matrix.name }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image }}
          severity: ${{ matrix.severity }}
          ignore-unfixed: ${{ matrix.ignore_unfixed }}
          exit-code: 1

      - name: Install Kubescape
        run: curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash

      - name: Kubescape manifest scan — ${{ matrix.name }}
        run: ~/.kubescape/kubescape scan ${{ matrix.manifest }} --format pretty-printer --fail-threshold 30

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  deploy-secure-app:
    runs-on: self-hosted
    needs: [scan-apps, gitleaks]
    if: needs.scan-apps.result == 'success' || needs.scan-apps.result == 'failure'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only the app that passed (podinfo)
        run: |
          kubectl --context kind-k8sguard-dev apply -f infra/manifests/podinfo-secure.yaml
          kubectl --context kind-k8sguard-dev rollout status deployment/podinfo -n target-apps --timeout=120s
